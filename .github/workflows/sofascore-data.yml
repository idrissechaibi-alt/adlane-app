name: sofascore-data
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sofascore-data
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Récupérer les données SofaScore
        run: ./scripts/sofascore-snapshot.sh "$RUNNER_TEMP/out"
      - name: Publier sur la branche sofa-data
        run: |
          cd "$RUNNER_TEMP/out"
          git init -q -b sofa-data
          git config user.name "sofascore-bot"
          git config user.email "sofascore-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "snapshot $(cat updated-at)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" sofa-data

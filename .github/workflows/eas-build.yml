name: EAS Update (OTA)
on:
  push:
    branches:
      - main
    # La synchronisation automatique (gitAutoSync.ts) pousse un instantané de
    # data/app-adlane-data.json toutes les ~15-20 min, sans aucun changement
    # de code. Sans ce filtre, CHAQUE snapshot publiait une nouvelle mise à
    # jour OTA (même bundle, juste un ID différent) — l'app affichait alors
    # en permanence "nouvelle mise à jour disponible" pour rien.
    paths-ignore:
      # Tout le dossier data/ : instantanés et sauvegardes complètes poussés par l'app (des centaines par jour), stats
      # d'équipes et arbitres compilés chaque nuit. Aucun ne change le code : sans ce filtre, chacun publiait une
      # « nouvelle mise à jour » identique, et l'app en proposait une à chaque vérification.
      - 'data/**'
      - 'scripts/**'
      - '**/*.md'
jobs:
  update:
    name: Publish Update
    runs-on: ubuntu-latest
    env:
      CI: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 30

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EAS_TOKEN }}

      - name: Nom de la mise à jour (affiché dans l'app)
        run: |
          # Dernier commit de CODE (ni fusion, ni sauvegarde de l'app) : sa première phrase devient le nom de la mise à jour.
          NAME=$(git log --no-merges --format=%s -n 30 | grep -v '^\[APP adlane\]' | grep -v "^Stats d'équipes" | head -1)
          # Nom court : jusqu'au premier « : » ou « ; » s'il arrive assez tôt, sinon coupé sur un mot (pas au milieu).
          NAME=$(node -e '
            let s = process.argv[1].trim();
            const cut = s.search(/ [:;] /);
            if (cut >= 12 && cut <= 70) s = s.slice(0, cut);
            if (s.length > 90) s = s.slice(0, 90).replace(/\s+\S*$/, "") + "…";
            console.log(s);
          ' "$NAME")
          node -e '
            const fs = require("fs");
            const app = JSON.parse(fs.readFileSync("app.json", "utf8"));
            app.expo.extra = { ...(app.expo.extra || {}), updateName: process.argv[1], updatePublishedAt: new Date().toISOString() };
            fs.writeFileSync("app.json", JSON.stringify(app, null, 2));
          ' "$NAME"
          echo "Nom : $NAME"

      - name: Publish update to production
        env:
          # Passé par variable d'environnement plutôt qu'interpolé directement
          # dans la commande : un message de commit contenant un guillemet
          # (fréquent en français, ex. "Matchs du jour") casse sinon la
          # commande en plusieurs arguments bruts et fait échouer eas update
          # SANS publier — ce qui s'est produit sur au moins un commit.
          EAS_UPDATE_MESSAGE: ${{ github.event.head_commit.message }}
        run: eas update --branch production --message "$EAS_UPDATE_MESSAGE"
